name: recipe_app
description: "Recipe app with SQLite storage, MVVM and Provider."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  get_it: ^9.3.0
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  http: ^1.6.0
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/recipetypes.json
    - assets/images/recipes/
